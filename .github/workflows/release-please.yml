name: Release Please

# VERZI NEPÍŠE ČLOVĚK. Odvozuje se z Conventional Commits: fix → PATCH, feat → MINOR,
# feat! nebo BREAKING CHANGE → MAJOR.
#
# Po každém sloučení do main release-please udržuje otevřený PULL REQUEST S VYDÁNÍM:
# příští verzi a changelog od minulé značky. Vydání je sloučení toho pull requestu —
# po review a branách jako u každé jiné změny.
#
# Dvě omezení GitHubu, která by jinak mlčela:
# 1. Pull request založený tokenem Actions NESPUSTÍ CI. Brány by na něm nikdy neproběhly,
#    proto se tu CI na jeho větvi spouští výslovně.
# 2. Značka vytvořená tokenem Actions NESPUSTÍ release.yml. Proto se volá přímo.
#
# Předpoklad: repozitář dovoluje GitHub Actions zakládat pull requesty
# (Settings → Actions → General → Workflow permissions).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Brány na pull requestu s vydáním
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          echo "$PRS" | jq -r '.[].headBranchName' | while read -r vetev; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$vetev"
            echo "CI spuštěno na $vetev"
          done

  vydani:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: write
