name: CI

on:
  pull_request:
  # Volá ho staging.yml po sloučení. Bez workflow_call GitHub to volání odmítne.
  workflow_call:

# KAŽDÁ BRÁNA JE VLASTNÍ JOB. V grafu běhu je pak vidět, KTERÁ spadla, aniž
# by kdokoli otevíral log — a to je přesně dovednost, kterou se tu učíme.
# Běží souběžně; žádná na jiné nezávisí.
jobs:
  pokryti-pozadavku:
    name: Pokrytí požadavků
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/gate-requirement-coverage.sh

  izolace-modulu:
    name: Izolace modulů
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/gate-isolation.sh

  testy:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: npm test

  determinismus:
    name: Determinismus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: bash scripts/gate-determinism.sh

  dvoji-dukaz:
    name: Dvojí důkaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: bash scripts/gate-negative-proof.sh

  # Jediný job, na který se váže ochrana hlavní větve. Zezelená, až projdou všechny.
  brany:
    name: Brány prošly
    needs: [pokryti-pozadavku, izolace-modulu, testy, determinismus, dvoji-dukaz]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Všech pět bran prošlo."
