name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Brány běží v tomtéž pořadí jako lokální `/gate`, aby se výsledek nelišil
      # podle toho, kde se spustí. Každá hlásí, co tvrdí, ne surový výstup nástroje.
      - name: Pokrytí požadavků
        run: bash scripts/gate-requirement-coverage.sh
      - name: Izolace modulů
        run: bash scripts/gate-isolation.sh
      - name: Testy
        run: npm test
      - name: Determinismus
        run: bash scripts/gate-determinism.sh
      - name: Dvojí důkaz
        run: bash scripts/gate-negative-proof.sh
