name: Vydání

# Volá ho release-please.yml, když člověk sloučí PULL REQUEST S VYDÁNÍM. Značku, kterou
# release-please vytvoří, by tenhle workflow sám neviděl (token Actions nespouští další
# workflow). Značka vyrobená ručně ho spustí přímo.
# Staging se mění při každém sloučení; vydání je okamžik, ke kterému se dá vrátit.
on:
  push:
    tags: ['app-v*']
  workflow_call:
    inputs:
      tag:
        description: Značka vydání, app-v<verze>
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Brány běží ZNOVU nad označkovaným commitem. Že prošly na main neznamená,
      # že prošly nad tím, co se právě vydává.
      - name: Brány nad označkovaným commitem
        run: bash scripts/gate.sh

      - name: Zabalit artefakt
        run: zip -r "prehravac-${TAG}.zip" src oracle README.md

      # Vydání s changelogem už založil release-please; ručně vyrobená značka ho nemá.
      - name: Přiložit artefakt k vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "prehravac-${TAG}.zip" --clobber
