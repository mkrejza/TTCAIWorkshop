name: Staging

# SLOUČENO ≠ VYDÁNO.
# Tenhle běh nasazuje na staging: po každém sloučení do main se tam objeví aktuální stav.
# Nikdo ho nepouští, spustí se sám. Vydání s verzí a značkou dělá release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Znovu pustí tytéž brány co na pull requestu — ne jiné, ne zkrácené.
  gates:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # Vystavuje se i orákulum. Bez záznamů nemá nasazená aplikace co otevřít
      # a slib „adresa, kterou si otevřete v telefonu" nejde splnit.
      - name: Sestavit web
        run: |
          mkdir -p _site
          cp -r src/. _site/
          mkdir -p _site/zaznamy && cp oracle/fixtures/*.json _site/zaznamy/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
