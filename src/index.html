<!doctype html>
<!-- DODANÁ KOSTRA — prvky a jejich id jsou dané, chování si napíšete v view/app.mjs. -->
<meta charset="utf-8">
<title>Přehrávač záznamů</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 2rem; max-width: 52rem; }
  h1 { font-size: 1.2rem; }
  #segments { list-style: none; padding: 0; }
  #segments li { padding: .4rem .6rem; border-bottom: 1px solid #eee; cursor: pointer; }
  #segments li[aria-selected="true"] { background: #eef7fa; }
  #error { color: #b00; }
</style>

<h1>Přehrávač záznamů</h1>

<p>
  <label for="sample">Ukázkový záznam</label>
  <select id="sample">
    <option value="">— vyberte —</option>
    <option value="zaznamy/00-tiny.json">00-tiny · dvanáct vzorků</option>
    <option value="zaznamy/01-clean.json">01-clean · dvě zařízení</option>
    <option value="zaznamy/03-same-second.json">03-same-second</option>
    <option value="zaznamy/05-gap.json">05-gap · mezera 47 minut</option>
    <option value="zaznamy/07-broken.json">07-broken · nečitelné vzorky</option>
  </select>
</p>

<p>nebo <input type="file" id="file" accept="application/json"></p>
<p id="error" role="alert"></p>

<ul id="segments"></ul>
<div id="chart"></div>

<script type="module" src="./view/app.mjs"></script>
